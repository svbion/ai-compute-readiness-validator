[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compute-readiness-validator"
version = "0.1.0"
description = "Automated Linux, NVIDIA GPU, InfiniBand, Slurm, Kubernetes, storage, and benchmark validation for AI compute infrastructure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.scripts]
ai-validator = "ai_validator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_validator*"]
