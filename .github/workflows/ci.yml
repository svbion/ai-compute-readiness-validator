name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall src tests -q
      - run: python -m pytest tests -q
      - run: python -m pip wheel . -w /tmp/gpuvalidator-platform-wheelhouse
      - run: python -m build
      - run: git diff --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm run lint
      - run: npm run test:portal
      - run: npm run build
      - run: git diff --check
  shell-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n tools/run-gpu-benchmark.sh
      - run: find tools -type f -name '*.sh' -exec bash -n {} \;
      - run: python -m pytest tests/test_benchmark_sanitization.py tests/test_platform_v02.py -q
      - run: git diff --check
