[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuvalidator-agent"
version = "0.1.0"
description = "Outbound-polling GPUValidator RunPod agent"
requires-python = ">=3.10"

[project.scripts]
gpuvalidator-agent = "gpuvalidator_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpuvalidator_agent*"]
